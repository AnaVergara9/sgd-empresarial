services:
  # ---------- Bases de datos ----------
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  empresa-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: empresa_db
    ports:
      - "5434:5432"
    volumes:
      - empresa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d empresa_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  canales-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: canales_db
    ports:
      - "5435:5432"
    volumes:
      - canales_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d canales_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  chat-db:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - chat_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Microfrontends ----------
  mf-navegacion:
    build:
      context: ./frontends/mf-navegacion
      # La navegación usa el módulo local (caché sin conexión), que vive fuera de su carpeta
      additional_contexts:
        local-module: ./local-module
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "5174:80"

  mf-chat:
    build:
      context: .
      dockerfile: frontends/mf-chat/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:4004}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "5175:80"

  mf-videollamada:
    build:
      context: ./frontends/mf-videollamada
      args:
        VITE_VIDEOLLAMADA_URL: ${VITE_VIDEOLLAMADA_URL:-http://localhost:4006}
    ports:
      - "5176:80"

  shell:
    build:
      context: ./frontends
      dockerfile: shell/Dockerfile
      # El shell usa el módulo local para recordar el perfil sin conexión
      additional_contexts:
        local-module: ./local-module
      args:
        VITE_API_URL: http://localhost:4000
        VITE_MF_NAVEGACION_URL: http://localhost:5174
        VITE_MF_CHAT_URL: http://localhost:5175
        VITE_MF_VIDEOLLAMADA_URL: http://localhost:5176
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    ports:
      - "5173:80"
    depends_on:
      - mf-navegacion
      - mf-chat
      - mf-videollamada

  # ---------- Microservicios ----------
  auth-service:
    build: ./services/auth-service
    environment:
      PORT: 4001
      DATABASE_URL: postgres://postgres:postgres@auth-db:5432/auth_db
    depends_on:
      auth-db:
        condition: service_healthy

  empresa-service:
    build: ./services/empresa-service
    environment:
      PORT: 4002
      DATABASE_URL: postgres://postgres:postgres@empresa-db:5432/empresa_db
    depends_on:
      empresa-db:
        condition: service_healthy

  canales-service:
    build: ./services/canales-service
    environment:
      PORT: 4003
      DATABASE_URL: postgres://postgres:postgres@canales-db:5432/canales_db
    depends_on:
      canales-db:
        condition: service_healthy

  chat-service-1:
    build: ./services/chat-service
    environment:
      PORT: 4004
      MONGO_URL: mongodb://chat-db:27017/chat_db
      REDIS_URL: redis://redis:6379
    depends_on:
      chat-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat-service-2:
    build: ./services/chat-service
    environment:
      PORT: 4004
      MONGO_URL: mongodb://chat-db:27017/chat_db
      REDIS_URL: redis://redis:6379
    depends_on:
      chat-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat-nginx:
    image: nginx:alpine
    ports:
      - "4004:80"
    volumes:
      - ./services/chat-load-balancer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - chat-service-1
      - chat-service-2

  videollamada-service:
    build: ./services/videollamada-service
    environment:
      PORT: 4006
      REDIS_URL: redis://redis:6379
      SOCKET_CORS_ORIGIN: http://localhost:5173,http://localhost:5176
    ports:
      - "4006:4006"
    depends_on:
      redis:
        condition: service_healthy

  archivos-service:
    build: ./services/archivos-service
    environment:
      PORT: 4005
      URL_PUBLICA: http://localhost:4000
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET:-chat_upload}
    volumes:
      - archivos_data:/app/uploads

  # ---------- Puerta de entrada ----------
  gateway:
    build: ./gateway
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      AUTH_URL: http://auth-service:4001
      EMPRESA_URL: http://empresa-service:4002
      CANALES_URL: http://canales-service:4003
      CHAT_URL: http://chat-nginx:80
      ARCHIVOS_URL: http://archivos-service:4005
      VIDEOLLAMADA_URL: http://videollamada-service:4006
    depends_on:
      - auth-service
      - empresa-service
      - canales-service
      - chat-nginx
      - archivos-service
      - videollamada-service

volumes:
  auth_data:
  empresa_data:
  canales_data:
  chat_data:
  archivos_data:
